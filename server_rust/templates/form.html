<form id="patient-input-form" hx-post="/api/predict" hx-trigger="input delay:250ms, change, formUpdated from:body" hx-target="#dashboard-dynamic-updates">
  <div class="patient-form-grid">
    
    <div class="field-group">
      <label class="field-label"><span>Age (Years)</span><span style="font-family: var(--font-mono);">{{ age }}</span></label>
      <input type="number" name="Age" class="field-input" value="{{ age }}" min="20" max="95">
    </div>

    <div class="field-group">
      <label class="field-label"><span>Systolic BP (mmHg)</span><span style="font-family: var(--font-mono);">{{ bp }}</span></label>
      <input type="number" name="BP" class="field-input" value="{{ bp }}" min="80" max="220">
    </div>

    <div class="field-group">
      <label class="field-label"><span>Pulse Rate (bpm)</span><span style="font-family: var(--font-mono);">{{ pr }}</span></label>
      <input type="number" name="PR" class="field-input" value="{{ pr }}" min="40" max="150">
    </div>

    <div class="field-group">
      <label class="field-label"><span>Fasting Blood Sugar</span><span style="font-family: var(--font-mono);">{{ fbs }} mg/dL</span></label>
      <input type="number" name="FBS" class="field-input" value="{{ fbs }}" min="60" max="350">
    </div>

    <div class="field-group">
      <label class="field-label"><span>Serum Creatinine</span><span style="font-family: var(--font-mono);">{{ cr }} mg/dL</span></label>
      <input type="number" step="0.1" name="CR" class="field-input" value="{{ cr }}" min="0.4" max="4.0">
    </div>

    <div class="field-group">
      <label class="field-label"><span>Triglycerides (TG)</span><span style="font-family: var(--font-mono);">{{ tg }} mg/dL</span></label>
      <input type="number" name="TG" class="field-input" value="{{ tg }}" min="40" max="600">
    </div>

    <div class="field-group">
      <label class="field-label"><span>LDL Cholesterol</span><span style="font-family: var(--font-mono);">{{ ldl }} mg/dL</span></label>
      <input type="number" name="LDL" class="field-input" value="{{ ldl }}" min="30" max="260">
    </div>

    <div class="field-group">
      <label class="field-label"><span>HDL Cholesterol</span><span style="font-family: var(--font-mono);">{{ hdl }} mg/dL</span></label>
      <input type="number" name="HDL" class="field-input" value="{{ hdl }}" min="15" max="95">
    </div>

    <div class="field-group">
      <label class="field-label"><span>Ejection Fraction (EF)</span><span style="font-family: var(--font-mono);">{{ ef }}%</span></label>
      <input type="number" name="EF-TTE" class="field-input" value="{{ ef }}" min="15" max="75">
    </div>

    <div class="field-group">
      <label class="field-label"><span>Region RWMA Count</span><span style="font-family: var(--font-mono);">{{ rwma }}</span></label>
      <input type="number" name="Region RWMA" class="field-input" value="{{ rwma }}" min="0" max="5">
    </div>

    <div class="field-group">
      <label class="field-label"><span>Biological Sex</span></label>
      <select name="Sex" class="field-input">
        <option value="Male" {% if sex == "Male" %}selected{% endif %}>Male</option>
        <option value="Fmale" {% if sex != "Male" %}selected{% endif %}>Female</option>
      </select>
    </div>

    <div class="field-group">
      <label class="field-label"><span>Typical Chest Pain</span></label>
      <select name="Typical Chest Pain" class="field-input">
        <option value="0" {% if typ_cp == 0 or typ_cp == "0" %}selected{% endif %}>No (Absent)</option>
        <option value="1" {% if typ_cp == 1 or typ_cp == "1" %}selected{% endif %}>Yes (Present)</option>
      </select>
    </div>

  </div>

  <div style="display: none;">
    {% for hf in hidden_fields %}
      <input type="hidden" name="{{ hf.key }}" value="{{ hf.value }}">
    {% endfor %}
  </div>
</form>
