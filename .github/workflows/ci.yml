name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install --upgrade pip && pip install -r ml/requirements.txt
      - name: Verify shipped model bundle
        run: |
          python -c "import joblib; from ml.pipeline import load_schema; from ml.service import predict_patient; b = joblib.load('ml/artifacts/model_bundle.joblib'); res = predict_patient(b['test_sample_inputs'][0], {**b, 'schema': load_schema()}); print('Shipped bundle inference OK, CAD prob:', res['cad']['prob'])"
      - name: Run training and nested CV
        run: python -m ml.train
      - name: Run unit tests
        run: python -m pytest ml/tests api/tests -v
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

